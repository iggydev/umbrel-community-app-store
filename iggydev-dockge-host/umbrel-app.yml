manifestVersion: 1.1
id: iggydev-dockge-host
category: developer
name: Dockge Host
version: "1.5.0-1"
tagline: Dockge connected directly to the Umbrel host Docker
description: >-
  A standalone Dockge instance for power users that connects directly to the
  Umbrel host Docker daemon instead of using Docker-in-Docker.


  Unlike the stock Umbrel Dockge package, this app mounts the host Docker
  socket and the persistent Dockge stacks directory at the same absolute path.
  This allows bind-mounted Compose volumes to resolve correctly on the host.


  ⚠️ This app has full control over the Umbrel host Docker daemon. Only install
  it if you understand and trust the Compose files you run through Dockge.


  This app is intended to run alongside the stock Umbrel Dockge during
  migration and testing. It does not modify the existing Dockge installation.
website: https://dockge.kuma.pet
dependencies: []
repo: https://github.com/louislam/dockge
support: https://github.com/louislam/dockge/issues
port: 5005
icon: https://raw.githubusercontent.com/louislam/dockge/master/frontend/public/icon.svg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Initial release of the IggyDev Dockge Host package. Uses Dockge 1.5.0 with
  direct access to the Umbrel host Docker daemon and the persistent host stack
  directory.
developer: Louis Lam
submitter: IggyDev
submission: https://github.com/iggydev/umbrel-community-app-store
