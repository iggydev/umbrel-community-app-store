version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: iggydev-lighterpack_lighterpack_1
      APP_PORT: 3000

  mongodb:
    image: mongo:5.0
    restart: always
    volumes:
      - ${APP_DATA_DIR}/data/mongodb:/data/db
      - ${APP_DATA_DIR}/data/mongodb:/data/configdb

  lighterpack:
    image: ghcr.io/iggydev/lighterpack:111@sha256:884627d13b735fcb008c30c5e0bd65fbfdef92b6c15654b306d70bbdc14a0d5c
    restart: always
    depends_on:
      - mongodb
    volumes:
      - ${APP_DATA_DIR}/data/images:/var/www/lighterpack/public/gear
      - ${APP_DATA_DIR}/data/uploads:/var/www/lighterpack/public/uploads
