manifestVersion: 1.1
id: iggydev-lighterpack
category: utilities
name: Lighterpack
version: "1.0.0"
tagline: Lightweight gear list manager
description: >-
  A native Umbrel installation of Lighterpack using the existing AMD64
  Lighterpack image and the official MongoDB 5.0 image.

  This app stores MongoDB data, gear images, and uploads in its own persistent
  Umbrel app-data directory.

  IMPORTANT: This app is a private, unfinished personal modification of
  Lighterpack and is NOT intended for public redistribution or general use.
  The container image is private. Do not redistribute, mirror, or share the
  image without the author's permission.
website: https://lighterpack.com
dependencies: []
repo: https://github.com/iggydev/umbrel-community-app-store
support: https://github.com/iggydev/umbrel-community-app-store/issues
port: 3000
icon: https://raw.githubusercontent.com/iggydev/umbrel-community-app-store/master/iggydev-lighterpack/lighterpack_160.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Initial native Umbrel app. Uses the official MongoDB 5.0 AMD64 image and a
  private custom Lighterpack image.
developer: IggyDev
submitter: IggyDev
submission: https://github.com/iggydev/umbrel-community-app-store
