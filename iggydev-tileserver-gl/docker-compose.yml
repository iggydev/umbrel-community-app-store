version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: iggydev-tileserver-gl_tileserver-gl_1
      APP_PORT: 8080

  tileserver-gl:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - -p
      - "8080"
      - -c
      - /data/conf.json
