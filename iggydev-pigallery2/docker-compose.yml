version: "3.7"

x-umbrel-gpu-patches:
  app_proxy:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
  server:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991

services:
  app_proxy:
    environment:
      APP_HOST: iggydev-pigallery2_server_1
      APP_PORT: 80

  server:
    image: bpatrik/pigallery2:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Zagreb
      PG2_TRASH_DIR: /app/data/trash
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/data/config
      - ${APP_DATA_DIR}/data/db:/app/data/db
      - ${APP_DATA_DIR}/data/tmp:/app/data/tmp
      - ${APP_DATA_DIR}/data/trash:/app/data/trash
      - ${UMBREL_ROOT}/network/10.1.1.3/Media:/app/data/images/Media:ro
      - ${UMBREL_ROOT}/network/10.1.1.3/Photo:/app/data/images/Fotografije:ro
      - ${UMBREL_ROOT}/network/10.1.1.3/Video:/app/data/images/Video:ro
    ports:
      - 8116:80
